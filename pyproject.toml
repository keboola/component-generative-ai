[project]
name = "generative-ai"
dynamic = ["version"]
readme = "README.md"
requires-python = "~=3.13.0"
dependencies = [
    "aiolimiter>=1.2.1",
    "anthropic==0.42.0",
    "backoff>=2.2.1",
    "dataconf>=3.6.0",
    "google-generativeai==0.8.3",
    "grpcio==1.67.1",
    "kbcstorage==0.7.2",
    "keboola-component==1.4.4",
    "keboola-http-client",
    "keboola-utils==1.1.0",
    "openai==1.99.9",
    "pystache>=0.6.8",
]

[dependency-groups]
dev = [
    "freezegun>=1.5.5",
    "mock>=4.0.3",
    "pre-commit>=4.2.0",
    "pytest>=8.0.0",
    "ruff>=0.11.0",
    "ty>=0.0.1a7",
]

[tool.ruff]
line-length = 120

[tool.ruff.lint]
extend-select = [
    "I",   # isort - import sorting
    "UP",  # pyupgrade - modern Python syntax
]

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]

[tool.ty.environment]
extra-paths = ["src"]
